[build]
  [build.args]
    NODE_VERSION = "20"
    VITE_SUPABASE_URL = "https://bgthrhrwbxdcmwracvcj.supabase.co"
    VITE_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJndGhyaHJ3YnhkY213cmFjdmNqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDk4Mjg3NjYsImV4cCI6MjA2NTQwNDc2Nn0.DuTAtqYjqYtApqaoTbszzKvvruh0F3qf8TS8iP1tu0s"
    VITE_API_URL = "https://tirva-admin.fly.dev"
    IMAGE_CDN_URL = "https://cdn.plateos.fi"

[env]
  NODE_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256